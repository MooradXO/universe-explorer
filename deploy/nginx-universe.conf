# Included from nginx's http context; these limits apply only to Universe Explorer.
limit_req_zone $binary_remote_addr zone=universe_catalog:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=universe_online:1m rate=6r/m;

server {
    server_name universe.projectai.biz;
    root /var/www/universe-explorer/current/public;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ~ /\. {
        return 404;
    }
    location ~ ^/__catalog/(online|enrich/[0-9]+)$ {
        limit_req zone=universe_online burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4312;
        proxy_set_header Host 127.0.0.1:4312;
        proxy_set_header Origin "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location /__catalog/ {
        limit_req zone=universe_catalog burst=90 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4312;
        proxy_set_header Host 127.0.0.1:4312;
        proxy_set_header Origin "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/universe.projectai.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universe.projectai.biz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name universe.projectai.biz;
    if ($host = universe.projectai.biz) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
